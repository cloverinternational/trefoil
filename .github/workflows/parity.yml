name: differential parity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mcowger/plexus
          ref: 31b09cebac35338ce4ff2a07035a3ae2062d3920
          path: .reference/plexus
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: oven-sh/setup-bun@v2
      - name: Install reference dependencies
        working-directory: .reference/plexus
        run: bun install --frozen-lockfile
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --prefix frontend
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend run test:e2e
      - name: Build reference frontend and assets
        working-directory: .reference/plexus
        run: bun run build:frontend && bun run generate:openapi:asset
      - run: cargo test --all-targets
      - run: ./parity/test-oauth-storage.sh
      - run: REFERENCE_DIR=.reference/plexus PLEXUS_PORT=4410 TREFOIL_PORT=8810 POSTGRES_PORT=0 SKIP_REFERENCE_BUILD=1 ./parity/run.sh
