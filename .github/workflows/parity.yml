name: differential parity
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trefoil
          POSTGRES_USER: trefoil
          POSTGRES_PASSWORD: trefoil
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trefoil -d trefoil"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mcowger/plexus
          ref: 31b09cebac35338ce4ff2a07035a3ae2062d3920
          path: .reference/plexus
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --prefix frontend
      - run: cargo test --all-targets
      - run: npm --prefix frontend run test:e2e
      - run: REFERENCE_DIR=.reference/plexus PLEXUS_PORT=4410 TREFOIL_PORT=8810 POSTGRES_PORT=5432 ./parity/run.sh
