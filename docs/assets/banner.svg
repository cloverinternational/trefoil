<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Trefoil — self-hosted LLM API gateway and router</title>
  <desc id="d">Clients speaking OpenAI, Anthropic and Gemini formats connect through Trefoil to many upstream providers.</desc>
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35b271" stop-opacity=".15"/>
      <stop offset=".5" stop-color="#35b271"/>
      <stop offset="1" stop-color="#35b271" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#35b271" stop-opacity=".28"/>
      <stop offset="1" stop-color="#35b271" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: Geist, "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
      .flow { stroke-dasharray: 6 10; animation: dash 1.6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -32; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="360" fill="#0a0a0a"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <ellipse cx="1000" cy="180" rx="320" ry="200" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="4" fill="#35b271"/>
  <rect x=".5" y=".5" width="1279" height="359" fill="none" stroke="#262626"/>

  <!-- Wordmark -->
