<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Trefoil — self-hosted LLM API gateway and router</title>
  <desc id="d">Clients speaking OpenAI, Anthropic and Gemini formats connect through Trefoil to many upstream providers.</desc>
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e" stop-opacity=".15"/>
      <stop offset=".5" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22c55e" stop-opacity=".28"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: Geist, "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
      .flow { stroke-dasharray: 6 10; animation: dash 1.6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -32; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="360" fill="#0a0a0a"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <ellipse cx="1000" cy="180" rx="320" ry="200" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="4" fill="#22c55e"/>
  <rect x=".5" y=".5" width="1279" height="359" fill="none" stroke="#262626"/>

  <!-- Wordmark -->
  <g transform="translate(66 80) scale(2)">
    <defs>
      <linearGradient id="b0g" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#15803D"/><stop offset=".55" stop-color="#22C55E"/><stop offset="1" stop-color="#86EFAC"/>
      </linearGradient>
      <path id="b0l" fill="url(#b0g)" d="M0 0C-3 -3 -12 -9 -12 -17C-12 -22 -8.5 -25 -5 -25C-2.5 -25 -.8 -23.7 0 -22C.8 -23.7 2.5 -25 5 -25C8.5 -25 12 -22 12 -17C12 -9 3 -3 0 0Z"/>
    </defs>
    <g transform="translate(32 36)">
      <use href="#b0l" transform="translate(0 -1.5)"/>
      <use href="#b0l" transform="rotate(120) translate(0 -1.5)"/>
      <use href="#b0l" transform="rotate(240) translate(0 -1.5)"/>
      <g stroke="#052E16" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 -23V0"/><path d="M0 0L15.6 9"/><path d="M0 0L-15.6 9"/>
      </g>
      <path d="M0 -31V-23" stroke="#22C55E" stroke-width="1.7" stroke-linecap="round"/>
      <circle cy="-31" r="2" fill="#22C55E"/>
      <g fill="#ECFDF5" stroke="#052E16" stroke-width="1.1">
        <circle r="2.6"/><circle cx="15.6" cy="9" r="2.1"/><circle cx="-15.6" cy="9" r="2.1"/>
      </g>
    </g>
  </g>
  <text x="212" y="170" class="sans" font-size="76" font-weight="700" letter-spacing="-2" fill="#fafafa">Trefoil</text>
  <text x="214" y="208" class="sans" font-size="23" fill="#a3a3a3">Self-hosted LLM API gateway &amp; router</text>
  <text x="214" y="238" class="mono" font-size="14" fill="#737373">one endpoint · any wire format · automatic failover</text>

  <g class="mono" font-size="12" fill="#d4d4d4">
    <g transform="translate(64 276)">
      <rect width="62" height="26" fill="none" stroke="#404040"/><text x="31" y="17" text-anchor="middle">Rust</text>
    </g>
    <g transform="translate(134 276)">
      <rect width="98" height="26" fill="none" stroke="#404040"/><text x="49" y="17" text-anchor="middle">PostgreSQL</text>
    </g>
    <g transform="translate(240 276)">
      <rect width="54" height="26" fill="none" stroke="#404040"/><text x="27" y="17" text-anchor="middle">MCP</text>
    </g>
    <g transform="translate(302 276)">
      <rect width="146" height="26" fill="none" stroke="#22c55e"/><text x="73" y="17" text-anchor="middle" fill="#22c55e">Plexus-compatible</text>
    </g>
  </g>

  <!-- Routing diagram -->
  <g class="mono" font-size="12">
    <!-- client -> hub -->
    <g fill="none" stroke="url(#flow)" stroke-width="1.5">
      <path class="flow" d="M 800 112 H 872 V 180 H 940"/>
      <path class="flow" d="M 800 180 H 940"/>
      <path class="flow" d="M 800 248 H 872 V 180 H 940"/>
    </g>
    <!-- hub -> providers -->
    <g fill="none" stroke="url(#flow)" stroke-width="1.5">
      <path class="flow" d="M 1060 180 H 1100 V 92 H 1140"/>
      <path class="flow" d="M 1060 180 H 1100 V 148 H 1140"/>
      <path class="flow" d="M 1060 180 H 1100 V 212 H 1140"/>
      <path class="flow" d="M 1060 180 H 1100 V 268 H 1140"/>
    </g>

    <!-- clients -->
    <g fill="#111111" stroke="#404040">
      <rect x="680" y="96" width="120" height="32"/>
      <rect x="680" y="164" width="120" height="32"/>
      <rect x="680" y="232" width="120" height="32"/>
    </g>
    <g fill="#e5e5e5" text-anchor="middle">
      <text x="740" y="117">OpenAI</text>
      <text x="740" y="185">Anthropic</text>
      <text x="740" y="253">Gemini</text>
    </g>

    <!-- hub -->
    <rect x="940" y="140" width="120" height="80" fill="#111111" stroke="#22c55e" stroke-width="1.5"/>
    <g transform="translate(971 141) scale(.9)">
      <defs>
        <linearGradient id="b1g" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#15803D"/><stop offset=".55" stop-color="#22C55E"/><stop offset="1" stop-color="#86EFAC"/>
        </linearGradient>
        <path id="b1l" fill="url(#b1g)" d="M0 0C-3 -3 -12 -9 -12 -17C-12 -22 -8.5 -25 -5 -25C-2.5 -25 -.8 -23.7 0 -22C.8 -23.7 2.5 -25 5 -25C8.5 -25 12 -22 12 -17C12 -9 3 -3 0 0Z"/>
      </defs>
      <g transform="translate(32 36)">
        <use href="#b1l" transform="translate(0 -1.5)"/>
        <use href="#b1l" transform="rotate(120) translate(0 -1.5)"/>
        <use href="#b1l" transform="rotate(240) translate(0 -1.5)"/>
        <g stroke="#052E16" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M0 -23V0"/><path d="M0 0L15.6 9"/><path d="M0 0L-15.6 9"/>
        </g>
        <path d="M0 -31V-23" stroke="#22C55E" stroke-width="1.7" stroke-linecap="round"/>
        <circle cy="-31" r="2" fill="#22C55E"/>
        <g fill="#ECFDF5" stroke="#052E16" stroke-width="1.1">
          <circle r="2.6"/><circle cx="15.6" cy="9" r="2.1"/><circle cx="-15.6" cy="9" r="2.1"/>
        </g>
      </g>
    </g>
    <text x="1000" y="212" text-anchor="middle" fill="#a3a3a3" font-size="10" letter-spacing="1.5">ROUTER</text>

    <!-- providers -->
    <g fill="#111111" stroke="#404040">
      <rect x="1140" y="76" width="96" height="32"/>
      <rect x="1140" y="132" width="96" height="32"/>
      <rect x="1140" y="196" width="96" height="32"/>
      <rect x="1140" y="252" width="96" height="32"/>
    </g>
    <g fill="#e5e5e5" text-anchor="middle">
      <text x="1188" y="97">provider A</text>
      <text x="1188" y="153">provider B</text>
      <text x="1188" y="217">provider C</text>
      <text x="1188" y="273">self-hosted</text>
    </g>
    <text x="740" y="82" text-anchor="middle" fill="#737373" font-size="10" letter-spacing="1.5">CLIENTS</text>
    <text x="1188" y="62" text-anchor="middle" fill="#737373" font-size="10" letter-spacing="1.5">UPSTREAMS</text>
  </g>
</svg>
