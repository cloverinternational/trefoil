.55 90.14 44.14Q90.81 44.73 92.2 44.73L95.32 44.73L95.32 48.84ZM191.01 48.84Q188.57 48.84 187.13 47.6Q185.7 46.35 185.7 43.6L185.7 19.38L191.01 19.38L191.01 43.06Q191.01 43.92 191.43 44.32Q191.86 44.73 192.66 44.73L194.28 44.73L194.28 48.84ZM98.73 48.84L98.73 26.69L103.7 26.69L103.84 31Q104.37 29.13 105.34 28.12Q106.73 26.69 109.12 26.69L111.17 26.69L111.17 31.23L109.11 31.23Q107.4 31.23 106.28 31.74Q105.17 32.24 104.61 33.3Q104.05 34.35 104.05 36.08L104.05 48.84ZM160.57 45.04Q163.13 45.04 164.54 43.12Q165.95 41.2 165.95 37.76Q165.95 34.35 164.54 32.42Q163.13 30.49 160.57 30.49Q158.01 30.49 156.59 32.42Q155.17 34.35 155.17 37.76Q155.17 41.2 156.59 43.12Q158.01 45.04 160.57 45.04ZM175.08 48.84L175.08 26.69L180.39 26.69L180.39 48.84ZM117.51 35.67L127.74 35.67Q127.58 32.98 126.22 31.67Q124.86 30.37 122.75 30.37Q120.62 30.37 119.23 31.74Q117.84 33.1 117.51 35.67ZM174.98 23.72L174.98 19.03L180.49 19.03L180.49 23.72Z"/></g>
  <text x="219" y="184" class="sans" font-size="23" fill="#a3a3a3">Self-hosted LLM API gateway &amp; router</text>
  <text x="219" y="214" class="mono" font-size="14" fill="#737373">one endpoint · any wire format · automatic failover</text>

  <g class="mono" font-size="12" fill="#d4d4d4">
    <g transform="translate(64 276)">
      <rect width="62" height="26" fill="none" stroke="#404040"/><text x="31" y="17" text-anchor="middle">Rust</text>
    </g>
    <g transform="translate(134 276)">
      <rect width="98" height="26" fill="none" stroke="#404040"/><text x="49" y="17" text-anchor="middle">PostgreSQL</text>
    </g>
    <g transform="translate(240 276)">
      <rect width="54" height="26" fill="none" stroke="#404040"/><text x="27" y="17" text-anchor="middle">MCP</text>
    </g>
    <g transform="translate(302 276)">
      <rect width="146" height="26" fill="none" stroke="#35b271"/><text x="73" y="17" text-anchor="middle" fill="#35b271">Plexus-compatible</text>
    </g>
  </g>

  <!-- Routing diagram -->
  <g class="mono" font-size="12">
    <!-- client -> hub -->
    <g fill="none" stroke="url(#flow)" stroke-width="1.5">
      <path class="flow" d="M 800 112 H 872 V 180 H 940"/>
      <path class="flow" d="M 800 180 H 940"/>
      <path class="flow" d="M 800 248 H 872 V 180 H 940"/>
    </g>
    <!-- hub -> providers -->
    <g fill="none" stroke="url(#flow)" stroke-width="1.5">
      <path class="flow" d="M 1060 180 H 1100 V 92 H 1140"/>
      <path class="flow" d="M 1060 180 H 1100 V 148 H 1140"/>
      <path class="flow" d="M 1060 180 H 1100 V 212 H 1140"/>
      <path class="flow" d="M 1060 180 H 1100 V 268 H 1140"/>
    </g>

    <!-- clients -->
    <g fill="#111111" stroke="#404040">
      <rect x="680" y="96" width="120" height="32"/>
      <rect x="680" y="164" width="120" height="32"/>
      <rect x="680" y="232" width="120" height="32"/>
    </g>
    <g fill="#e5e5e5" text-anchor="middle">
      <text x="740" y="117">OpenAI</text>
      <text x="740" y="185">Anthropic</text>
      <text x="740" y="253">Gemini</text>
    </g>

    <!-- hub -->
    <rect x="940" y="140" width="120" height="80" fill="#111111" stroke="#35b271" stroke-width="1.5"/>
    <path transform="translate(975 146) scale(.78)" fill="#35b271" d="M46.44 16.28C46.44 17.91 46.17 19.49 45.66 20.96C38.66 21.29 32.52 24.93 28.77 30.35C22.35 28.89 17.56 23.14 17.56 16.28C17.56 8.3 24.03 1.84 32 1.84C39.97 1.84 46.44 8.3 46.44 16.28ZM30.88 43.23C30.88 51.2 24.41 57.67 16.44 57.67C8.46 57.67 2 51.2 2 43.23C2 36.21 7.01 30.36 13.66 29.06C17.24 34.61 23.28 38.44 30.25 38.99C30.66 40.33 30.88 41.75 30.88 43.23ZM62 43.23C62 51.2 55.54 57.67 47.56 57.67C43.22 57.67 39.33 55.75 36.68 52.72C38.22 49.73 39.09 46.34 39.09 42.75C39.09 39.4 38.34 36.23 36.99 33.39C39.63 30.56 43.39 28.79 47.56 28.79C55.54 28.79 62 35.26 62 43.23Z"/>
    <text x="1000" y="212" text-anchor="middle" fill="#a3a3a3" font-size="10" letter-spacing="1.5">ROUTER</text>

    <!-- providers -->
    <g fill="#111111" stroke="#404040">
      <rect x="1140" y="76" width="96" height="32"/>
      <rect x="1140" y="132" width="96" height="32"/>
      <rect x="1140" y="196" width="96" height="32"/>
      <rect x="1140" y="252" width="96" height="32"/>
    </g>
    <g fill="#e5e5e5" text-anchor="middle">
      <text x="1188" y="97">provider A</text>
      <text x="1188" y="153">provider B</text>
      <text x="1188" y="217">provider C</text>
      <text x="1188" y="273">self-hosted</text>
    </g>
    <text x="740" y="82" text-anchor="middle" fill="#737373" font-size="10" letter-spacing="1.5">CLIENTS</text>
    <text x="1188" y="62" text-anchor="middle" fill="#737373" font-size="10" letter-spacing="1.5">UPSTREAMS</text>
  </g>
</svg>
