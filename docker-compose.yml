services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trefoil}
      POSTGRES_USER: ${POSTGRES_USER:-trefoil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - trefoil-postgres:/var/lib/postgresql/data
    healthcheck:
      # $$ defers expansion to the container shell, so the check always uses
      # the user/database the container was started with.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-trefoil}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-trefoil}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-16}
      ADMIN_KEY: ${ADMIN_KEY:?Set ADMIN_KEY in .env}
      TREFOIL_CREDENTIAL_KEY: ${TREFOIL_CREDENTIAL_KEY:?Set TREFOIL_CREDENTIAL_KEY in .env}
      # Optional but strongly recommended: encrypts provider API keys, API key
      # secrets and other sensitive settings at rest. Empty disables encryption.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 8080
    volumes:
      # Persistent MCP_DATA_DIR for local MCP servers (<DATA_DIR>/mcp-servers).
      - trefoil-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:8080/healthz | grep -qx ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${TREFOIL_BIND_ADDRESS:-0.0.0.0}:${TREFOIL_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  trefoil-postgres:
  trefoil-data:
