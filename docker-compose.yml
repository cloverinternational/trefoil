services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trefoil}
      POSTGRES_USER: ${POSTGRES_USER:-trefoil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - trefoil-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trefoil -d trefoil"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-trefoil}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-trefoil}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-16}
      ADMIN_KEY: ${ADMIN_KEY:?Set ADMIN_KEY in .env}
      TREFOIL_CREDENTIAL_KEY: ${TREFOIL_CREDENTIAL_KEY:?Set TREFOIL_CREDENTIAL_KEY in .env}
      TREFOIL_PUBLIC_URL: ${TREFOIL_PUBLIC_URL:-http://127.0.0.1:${TREFOIL_PORT:-8080}}
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:8080/healthz | grep -qx ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${TREFOIL_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  trefoil-postgres:
