services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trefoil
      POSTGRES_USER: trefoil
      POSTGRES_PASSWORD: trefoil
    ports:
      - "5432:5432"
    volumes:
      - trefoil-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trefoil -d trefoil"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  trefoil-postgres:
